# Catalogo delle versioni: una sola fonte di verità per tutti i moduli.
# I numeri sono quelli LETTI dagli indici di Google Maven e Maven Central il
# 2026-08-26, non ricordati: le versioni di Android invecchiano in fretta e una
# scritta a memoria manda a caccia di un errore che non esiste.
[versions]
agp = "9.3.2"
kotlin = "2.4.10"
coreKtx = "1.18.0"
lifecycle = "2.10.0"
activityCompose = "1.12.4"
composeBom = "2026.06.01"
datastore = "1.2.1"
exif = "1.4.2"
# material3 esce dal BOM: le API Expressive (MaterialExpressiveTheme,
# MotionScheme) sono INTERNAL nella 1.4.0 stabile e diventano pubbliche solo
# sulla linea 1.5.0, che è alpha. Scelta dell'utente, 2026-08-26: il progetto
# è sperimentale, quindi si accetta l'alpha.
material3Alpha = "1.5.0-alpha26"
# Coil entra con la GRIGLIA (0.33) e non prima: una vista che decodifica decine di
# miniature mentre scorrono vuole una cache e un annullamento per riquadro, cioè
# proprio quello che una libreria di caricamento fa e che scriverlo in casa
# significherebbe rifare. Il visualizzatore singolo resta su `ImageDecoder`
# scritto in casa: là serve il controllo esatto sul campionamento, e Coil non
# c'entra.
# ⚠️ Il numero è LETTO da `repo1.maven.org/.../maven-metadata.xml` il 2026-08-28,
# e la nota vale come metodo: `search.maven.org` per lo stesso artefatto dava
# ancora la 3.2.0 del maggio 2025, cioè quattro minor indietro. L'indice di
# ricerca resta indietro, i metadati del repository no.
coil = "3.6.0"
# Media3 entra col PEZZO 2 dei video (0.86): riprodurre un filmato in casa vuol
# dire un decoder, un buffer, la gestione dell'audio e i codici che ogni telefono
# implementa a modo suo, cioè esattamente quello che una libreria di sistema fa.
# ⚠️ Il numero è LETTO da `dl.google.com/dl/android/maven2/.../maven-metadata.xml`
# il 2026-08-31 (ultima stabile, con le 1.11.0-alpha e beta già passate), non
# ricordato: vale la stessa regola di coil qui sopra.
media3 = "1.11.0"
# libavif entra con la DECODIFICA AVIF (1.26), ed è la libreria ufficiale di AOMedia,
# cioè libavif con dav1d compilati per Android. Serve perché `ImageDecoder` dichiara
# AVIF da API 31 ma poi chiede al decodificatore AV1 del telefono, che sui file veri
# (profilo 1, croma 4:4:4, livello 6.0) si rifiuta: la misura sta in `Avif.kt`.
# ⚠️ Il numero è LETTO da `repo1.maven.org/.../maven-metadata.xml` il 2026-09-02 e non
# ricordato, e ha una forma insolita apposta: al numero di versione di libavif segue il
# commit da cui è costruita, quindi `1.3.0.841110fd` è una stringa intera e non un
# `1.3.0` con un suffisso da togliere.
avif = "1.3.0.841110fd"
# androidsvg entra con la VISUALIZZAZIONE DEGLI SVG (1.31): Android non sa
# disegnare un SVG e non l'ha mai saputo. `ImageDecoder` conosce i formati a
# pixel, e la grafica vettoriale del sistema è un'altra cosa (`VectorDrawable`,
# che è un XML di Android e non un SVG). La misura sta in testa a `Svg.kt`.
# ⚠️ Il numero è LETTO da `repo1.maven.org/.../maven-metadata.xml` il 2026-09-02:
# la `1.4` è l'ultima e l'unica dopo la `1.3`, ed è del 2019. ⚠️ **Ferma non vuol
# dire abbandonata a caso**: è la stessa che Coil si porta dietro nel suo
# `coil-svg` (letto nel POM di `coil-svg-android` 3.6.0, che la dichiara come
# dipendenza a runtime), cioè la scelta di chi fa il caricatore che questo
# progetto già usa.
androidsvg = "1.4"

[libraries]
gifdecoder = { group = "com.github.bumptech.glide", name = "gifdecoder", version = "5.0.9" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3Alpha" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exif" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
avif-android = { group = "org.aomedia.avif.android", name = "avif", version.ref = "avif" }
androidsvg = { group = "com.caverock", name = "androidsvg-aar", version.ref = "androidsvg" }
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-ui-compose = { group = "androidx.media3", name = "media3-ui-compose", version.ref = "media3" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
