# Su quale Android gira il banco di prova.
#
# Si dichiara invece di lasciare il valore di serie, che è il `targetSdk` del modulo: quel
# numero cambia quando cambia la politica di Google Play, e con lui cambierebbe in silenzio
# la piattaforma su cui le prove girano. Qui il numero si muove solo quando lo si muove.
#
# 36 è la piattaforma più alta che Robolectric 4.16.1 conosce, e il numero è misurato dai due
# lati: con 36 le prove passano, con 37 falliscono tutte con `UnknownSdk`. La differenza con
# `compileSdk = 37` non tocca queste prove: qui si guarda la gerarchia dei tocchi, che fra le
# due non cambia.
#
# ⚠️⚠️ E QUESTO NUMERO DECIDE LA VERSIONE DI JAVA CHE SERVE PER LANCIARE IL BANCO: Robolectric
# dichiara un minimo per piattaforma, e questa vuole JAVA 21. Letto nel bytecode di
# `DefaultSdkProvider`, dove le API 34 e 35 portano 17 e la 36 porta 21. Su Java 17 non parte
# nemmeno una prova: la classe muore con `UnsupportedOperationException at
# DefaultSdkProvider.java:170`, che si legge come una catena di strumenti rotta ed è un
# controllo di versione. Chi abbassa questo numero può abbassare anche quello di `setup-java`
# in `.github/actions/toolchain`, e chi lo alza deve alzare l'altro per primo.
sdk=36
