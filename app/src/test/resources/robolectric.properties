# Su quale Android gira il banco di prova.
#
# Si dichiara invece di lasciare il valore di serie, che è il `targetSdk` del modulo: quel
# numero cambia quando cambia la politica di Google Play, e con lui cambierebbe in silenzio
# la piattaforma su cui le prove girano. Qui il numero si muove solo quando lo si muove.
#
# 36, cioè Android 16. Robolectric 4.17, entrato con la 6.21, conosce anche la 37 (letta nel
# bytecode di `DefaultSdkProvider`), e il passaggio è il lavoro `Diciassette` del brief, sua
# richiesta del 2026-10-15. Il banco simula una piattaforma per volta: passare alla 37 vuol dire
# provare l'app come gira su Android 17, e non più su Android 16. La differenza con `compileSdk`
# (37.1 dalla 6.24) non tocca queste prove: qui si guarda la gerarchia dei tocchi, che fra le due
# non cambia.
#
# ⚠️⚠️ NELLA 6.24 LA 37 NON REGGE, PER DIFETTI DEL SIMULATORE (sua scelta A1 del 2026-10-16:
# la 6.24 esce sulla 36, e la 37 diventa una versione a sé). Misure del 2026-10-15 e 16, banco
# intero di 770 prove: con la 6.24 sulla 37 quattro corse hanno avuto 3-5 prove rosse ciascuna, e
# le stesse sulla 36 due corse verdi. Le due cause trovate: l'onda del tocco di Material resta
# ferma a metà dissolvenza sopra l'elemento toccato (il rosso del tasto `Spessore` legge `ee483c`
# invece di `ff4c3f`, fermo anche dopo un secondo di orologio simulato), e nella prova della
# luminosità di `DisegnoTest` la cattura del palco non si aggiorna, anche se il valore arriva
# all'elemento.
#
# ⚠️⚠️ E LA 37 VUOLE COMPOSE 1.13, PER VIA DI ESPRESSO. `ui-test-junit4` 1.12 si porta dietro
# Espresso 3.5.0, che al primo tocco cerca `InputManager.getInstance()` per riflessione: sulla 37
# quel metodo non c'è più, e nel primo tentativo sono fallite 521 prove su 766, tutte con
# `NoSuchMethodException` dentro `InputManagerEventInjectionStrategy`. La 1.13.0-beta01, in uso
# dalla 6.24, si porta dietro Espresso 3.7.0, che dall'API 23 chiede l'`InputManager` al
# `Context` (letto nel bytecode della 3.7.0).
#
# ⚠️⚠️ E QUESTO NUMERO DECIDE LA VERSIONE DI JAVA CHE SERVE PER LANCIARE IL BANCO: Robolectric
# dichiara un minimo per piattaforma, e la 36 vuole JAVA 21. Letto nel bytecode di
# `DefaultSdkProvider`, dove le API 34 e 35 chiedono 17, la 36 e la 37 chiedono 21. Su Java 17
# non parte nemmeno una prova: la classe si ferma con `UnsupportedOperationException at
# DefaultSdkProvider.java:173` (la riga 170 nella 4.16.1), che si legge come una catena di
# strumenti rotta ed è un controllo di versione. Chi abbassa questo numero può abbassare anche
# quello di `setup-java` in `.github/actions/toolchain`, e chi lo alza deve alzare l'altro per
# primo.
sdk=36
#
# Lo scanner multimediale del banco risponde subito (6.25): senza, ogni prova che scrive un file
# aspettava 8 secondi veri un richiamo che Robolectric non manda mai. Il perché per esteso vive
# su `ScannerImmediato`.
shadows=io.github.roccobot.aiv.ScannerImmediato
