# Su quale Android gira il banco di prova.
#
# Si dichiara invece di lasciare il valore di serie, che è il `targetSdk` del modulo: quel
# numero cambia quando cambia la politica di Google Play, e con lui cambierebbe in silenzio
# la piattaforma su cui le prove girano. Qui il numero si muove solo quando lo si muove.
#
# 36 era la piattaforma più alta che Robolectric 4.16.1 conosceva, e il numero era misurato dai
# due lati: con 36 le prove passavano, con 37 fallivano tutte con `UnknownSdk`. Robolectric 4.17 (dalla 6.21)
# conosce anche la 37, letta nel bytecode di `DefaultSdkProvider`: passare alla 37 è una scelta a
# sé, con una corsa del banco intero, e non è entrata con l'aggiornamento della libreria. La
# differenza con `compileSdk = 37` non tocca queste prove: qui si guarda la gerarchia dei tocchi,
# che fra le due non cambia.
#
# ⚠️⚠️ E QUESTO NUMERO DECIDE LA VERSIONE DI JAVA CHE SERVE PER LANCIARE IL BANCO: Robolectric
# dichiara un minimo per piattaforma, e questa vuole JAVA 21. Letto nel bytecode di
# `DefaultSdkProvider`, dove le API 34 e 35 chiedono 17, la 36 e la 37 chiedono 21. Su Java 17
# non parte nemmeno una prova: la classe si ferma con `UnsupportedOperationException at
# DefaultSdkProvider.java:173` (la riga 170 nella 4.16.1), che si legge come una catena di
# strumenti rotta ed è un controllo di versione. Chi abbassa questo numero può abbassare anche
# quello di `setup-java` in `.github/actions/toolchain`, e chi lo alza deve alzare l'altro per
# primo.
sdk=36
