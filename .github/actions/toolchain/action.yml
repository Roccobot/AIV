name: Android toolchain
description: JDK, the preview platform, Gradle, and the cache of the platform the bench needs.

# ⚠️⚠️ THIS EXISTS BECAUSE TWO WORKFLOWS NEED THE SAME FOUR STEPS, and a copy in
# each is a second one to keep aligned: the day the platform name changes, the
# workflow nobody edited keeps building against the old one, and it fails at the
# worst moment. One place, and there is no second way to get it wrong.

runs:
  using: composite
  steps:
    # ⚠️⚠️ **JDK 21 AND NOT 17, AND THE BENCH IS WHAT FORCES IT.** Robolectric
    # declares a minimum Java version per Android platform, and the one this
    # project pins needs 21: read from the bytecode of `DefaultSdkProvider`,
    # where API 34 and 35 carry 17 and API 36 carries 21. On 17 the whole class
    # dies before a single test body runs, with
    # `UnsupportedOperationException at DefaultSdkProvider.java:170`, which reads
    # like a broken toolchain and is a version check.
    # ⚠️ It changes nothing about the artefact: `compileOptions` and `jvmTarget`
    # stay on 17, so the bytecode that ships is the same. This is the JVM that
    # RUNS Gradle, not the one the app targets.
    # ⚠️ And it is the version a session already builds and tests with, so the
    # runner now matches the machine the code is written on: a build that only
    # fails in one of the two is the worst kind to chase.
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '21'

    # compileSdk 37 lives on the SDK PREVIEW channel and its package is called
    # `platforms;android-37.1`: `android-37` does not exist at all, and asking
    # for it fails with a message that reads like a download problem instead of
    # a wrong name. Channel 3 is the preview one. Build tools are left to AGP,
    # which downloads the version it wants once the licences are accepted.
    - name: Install the preview platform
      shell: bash
      run: |
        set -euo pipefail
        sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
        if [ -z "$sdk" ]; then echo "No Android SDK on this runner" >&2; exit 1; fi
        # `pipefail` is off for this one line on purpose: sdkmanager closes
        # its stdin as soon as the last licence is accepted, `yes` dies of
        # SIGPIPE, and with pipefail on that kills the step even though the
        # licences went through. Without pipefail the pipeline reports
        # sdkmanager's own status, which is the one that matters.
        set +o pipefail
        yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
        set -o pipefail
        "$sdk/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.1"

    # ⚠️⚠️ `cache-provider: basic`, Rocco's choice A1 of 2026-10-16. From v6 the
    # default is `enhanced`, a proprietary caching service of Gradle Inc.; `basic`
    # (from v6.1.0) is built on GitHub's own cache, which is what v4 used. Its
    # limits (no cleanup, no deduplication) do not matter for a cache this small.
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-provider: basic

    # ⚠️ The bench downloads a fake Android platform of 213.431.622 bytes the
    # first time it runs, and that file lands in ~/.m2, which `setup-gradle`
    # does NOT cache: its cache covers Gradle's own, and Robolectric fetches
    # this one itself, through Maven's local repository.
    # ⚠️ The key is what decides WHICH platforms are fetched: the version
    # catalogue, which pins Robolectric, the properties file, which pins the API
    # level of most tests, and the `@Config(sdk = [...])` of the tests that ask
    # for another one (28, 29, 30 and 33 today). Without the last part a test on a
    # new API level fetched its platform at every run, because `actions/cache`
    # does not save again under a key it already has (6.30, Setaccio G22).
    - name: List the API levels the tests ask for
      id: sdks
      shell: bash
      run: |
        set -euo pipefail
        levels="$(grep -rhoE 'sdk = \[[^]]*\]' app/src/test app/src/testPlay | sort -u | sha256sum | cut -c1-16)"
        echo "hash=${levels}" >> "$GITHUB_OUTPUT"

    - name: Cache the platform the bench needs
      uses: actions/cache@v6
      with:
        path: ~/.m2/repository/org/robolectric
        key: robolectric-${{ hashFiles('gradle/libs.versions.toml', 'app/src/test/resources/robolectric.properties') }}-${{ steps.sdks.outputs.hash }}
