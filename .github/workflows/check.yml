name: Check

# ⚠️⚠️ NOT A DUPLICATE OF THE GATE IN `release.yml`, and the difference is WHEN
# it speaks: the gate refuses to publish a broken version, this one says it is
# broken BEFORE anyone tries to publish. Without it the first news of a red bench
# arrives at the moment somebody wanted to release, which is the worst one.
#
# ⚠️ It runs on `main` AND on pull requests, and the two cover different things.
# In this repository a PR is merged straight away (squash), so the run on the PR
# may not be finished when the merge happens: the one that really counts is the
# run on `main`, which looks at the code as it ended up. The PR one is there for
# the times a PR stays open, and it costs nothing to keep.
#
# ⚠️ `cancel-in-progress` is on: two pushes close together have no reason to run
# the same check twice, and what matters is always the latest state.

#
# ⚠️ A push that changes only `.md` files does not run it: the bench and the
# translation check read no Markdown, and the `core-sync` Action of
# Roccobot/tools commits `AGENTS.md` here every time the shared core changes.
# The filter is on `push` only: on a pull request a skipped check would leave
# a required status waiting forever, and those runs are rare anyway.

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the sources
        uses: actions/checkout@v5

      - name: Set up the Android toolchain
        uses: ./.github/actions/toolchain

      # ⚠️⚠️ TWO VARIANTS SINCE 5.10, AND THE BENCH RUNS ON BOTH, IN TWO DIFFERENT WAYS.
      # The whole bench runs on `github`, the app as it has always been. On `play` only
      # the classes named `*PlayTest` run (`app/src/testPlay`): the shared tests click
      # Delete, Rename, Move and the rest, which `play` leaves out, so there they would
      # fail by design. Which functions `play` leaves out lives in `Rules.md`.
      - name: Run the bench
        run: ./gradlew --no-daemon :app:testGithubDebugUnitTest :app:testPlayDebugUnitTest --tests '*PlayTest'

      - name: Check the translations
        run: python3 tools/i18n-check.py

      # ⚠️ Same reason as in `release.yml`: without the report a failure gives a
      # name and nothing else.
      - name: Keep the bench report when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bench-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

  # ⚠️⚠️ THE CACHES ARE PRUNED HERE, AND A PERSON DID IT BY HAND BEFORE. GitHub
  # keeps 10 GB of Actions caches per repository, and every run on main saves a
  # new copy of the Gradle home under a key that ends with the commit, a few
  # hundred MB each. Twice, at 4.36 and 4.43, the release bench fell with the
  # caches near the ceiling and passed once the owner emptied them from his
  # terminal (`gh cache delete --all`). Whether the ceiling was the cause is not
  # measured: a pull request run fell on the same tests at 4.45 with the caches
  # just emptied. Pruning removes the suspect and the manual step either way.
  # ⚠️ Least recently USED goes first, not oldest: the platform the bench needs
  # (213 MB, key unchanged for weeks) is restored by every run, so it stays.
  # ⚠️ The total is written to the run summary, because a session cannot read it:
  # its proxy refuses the Actions cache API.
  caches:
    needs: bench
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: Prune the Actions caches
        env:
          GH_TOKEN: ${{ github.token }}
          # Below the 10 GB ceiling with room for a release and a few runs.
          KEEP_BYTES: 6000000000
        run: |
          set -euo pipefail
          list="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" \
            --jq '.actions_caches[] | "\(.last_accessed_at) \(.id) \(.size_in_bytes)"' | sort)"
          total=0
          while read -r _ _ size; do total=$(( total + ${size:-0} )); done <<< "$list"
          before=$total; removed=0
          while read -r _ id size; do
            [ -n "$id" ] && [ "$total" -gt "$KEEP_BYTES" ] || break
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/caches/${id}" > /dev/null
            total=$(( total - size )); removed=$(( removed + 1 ))
          done <<< "$list"
          gb() { awk -v b="$1" 'BEGIN { printf "%.2f GB", b / 1e9 }'; }
          echo "Caches: $(gb "$before") before, $(gb "$total") after, ${removed} removed"
          echo "🗄️ Actions caches: $(gb "$before") before, $(gb "$total") after, ${removed} removed (ceiling 10 GB, kept under $(gb "$KEEP_BYTES"))." >> "$GITHUB_STEP_SUMMARY"
