name: Release

# TWO ways to release, and the second exists for a concrete reason: a session
# working on this repository CANNOT push a tag. The git proxy in front of it
# answers 403 on a tag ref while letting branch pushes through, so cutting a tag
# was always a manual step for a person, and the whole pipeline waited on it.
# `gh` inside the runner does not go through that proxy: it talks to the API with
# the runner's own token, so the workflow can cut its own tag.
#
#   - push of a `v*` tag: the classic way, still supported and unchanged.
#   - `workflow_dispatch` with `publish`: the workflow derives the tag from
#     versionName, creates it along with the release, and publishes.
#
# ⚠️ The dispatch way is also the SOUNDER of the two, which is worth knowing
# before treating it as a shortcut: a hand written tag can disagree with
# versionName, and all the workflow can do about it is refuse (see the check
# below). A tag derived from that same file cannot disagree at all.
#
# `workflow_dispatch` WITHOUT publish stays what it was, and it is not
# redundant: it is the DRY RUN. The first real tag is a terrible place to
# discover that the toolchain step is wrong, and a run without `publish` builds
# the APK and stops, touching no other repository.
# ⚠️ It used to be called 'the test bench' here, and since 1.73 that name belongs
# to something else: the tests that open the fake app, which this workflow now
# runs as a gate further down. Two things with one name, in a repository that
# talks about both every release, is two things somebody eventually swaps.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish for real: cut the tag from versionName and make the release'
        type: boolean
        default: false

# The automatic token is scoped to THIS repository, and since 2026-09-27 that is
# all a release needs: it attaches the APK to a release of this repo. The step
# that committed the APK and its page into the website repository, with a
# separate fine-grained PAT, is gone; the page is served by this repository
# (`pages.yml`), and its download button reads the release published here.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the sources
        uses: actions/checkout@v5

      # The four toolchain steps live in a composite action because `check.yml`
      # needs exactly the same ones: see `.github/actions/toolchain`.
      - name: Set up the Android toolchain
        uses: ./.github/actions/toolchain

      # The version is NOT taken from the tag. It lives in app/build.gradle.kts,
      # which stays its single source; a tag that arrives from outside is
      # compared against it, so a mismatch stops the release instead of
      # publishing a mislabelled APK, and a tag we cut ourselves is derived from
      # it and cannot mismatch.
      - name: Read the version, work out the tag, and check the ref
        id: ver
        env:
          PUBLISH: ${{ inputs.publish }}
          # Read from the context and not written as 'main': the name of the
          # default branch lives in one place already, and a copy here would be
          # a second one to keep aligned.
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' app/build.gradle.kts)"
          if [ -z "$version" ]; then
            echo "versionName not found in app/build.gradle.kts" >&2
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
              echo "Tag ${GITHUB_REF_NAME} does not match versionName ${version}" >&2
              exit 1
            fi
            tag="${GITHUB_REF_NAME}"
          else
            tag="v${version}"
            # ⚠️ A dispatch that publishes may only run from the DEFAULT branch,
            # and the guard is here rather than next to the release step so it
            # fails in a second instead of after a two minute build. Without it,
            # `Run workflow` on any branch would tag THAT branch's commit as a
            # released version, from a menu that gives no hint of the choice.
            if [ "${PUBLISH}" = "true" ] && [ "${GITHUB_REF_NAME}" != "${DEFAULT_BRANCH}" ]; then
              echo "Refusing to publish from '${GITHUB_REF_NAME}': only ${DEFAULT_BRANCH} may be released." >&2
              echo "Run it without 'publish' to just build this branch." >&2
              exit 1
            fi
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Building version ${version}, tag ${tag}"

      # ⚠️⚠️ THE GATE: A RED BENCH MEANS NO RELEASE AT ALL. Before this
      # step existed the bench only ran when somebody remembered to run it, which
      # is the same as not having it: the defect it is meant to catch is exactly
      # the kind nobody suspects, so nobody goes looking for it. The 1.70 blocked
      # the whole app and the 1.70 to 1.72 shipped a feature that did nothing,
      # both with a green build.
      # ⚠️ It sits BEFORE the keystore and the build on purpose: those two take
      # minutes and touch secrets, and there is no reason to spend either on a
      # version that is not going to go out.
      # ⚠️ The cheap guards stay ahead of it: a tag that disagrees with
      # versionName, or a publish from the wrong branch, fails in a second.
      - name: Run the bench
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      # ⚠️ The translations are a release check too, and the repo has said so for
      # versions: `28 lingue, 0 problemi`, and a lower number means a folder was
      # not seen. It was a step somebody had to remember, like the bench.
      - name: Check the translations
        run: python3 tools/i18n-check.py

      # ⚠️ Without this, a failure gives a name and nothing else: the report says
      # WHICH assertion fell and with what message, which is the only thing that
      # tells a red bench from a broken toolchain.
      - name: Keep the bench report when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bench-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      # An absent keystore is a warning and not a failure: a dispatch run is
      # allowed to prove that the build works before any secret exists. The
      # release step refuses an unsigned APK on its own, further down.
      - name: Restore the keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.AIV_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No AIV_KEYSTORE_BASE64 secret: the APK will be unsigned."
            exit 0
          fi
          printf '%s' "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/aiv.jks"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build the release APK
        env:
          AIV_KEYSTORE_FILE: ${{ steps.keystore.outputs.signed == 'true' && format('{0}/aiv.jks', runner.temp) || '' }}
          AIV_KEYSTORE_PASSWORD: ${{ secrets.AIV_KEYSTORE_PASSWORD }}
          AIV_KEY_ALIAS: ${{ secrets.AIV_KEY_ALIAS }}
          AIV_KEY_PASSWORD: ${{ secrets.AIV_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Name the artefact
        id: apk
        run: |
          set -euo pipefail
          src="$(find app/build/outputs/apk/release -name '*.apk' -print -quit)"
          if [ -z "$src" ]; then echo "No APK was produced" >&2; exit 1; fi
          name="AIV-${{ steps.ver.outputs.version }}.apk"
          mkdir -p "${RUNNER_TEMP}/out"
          cp "$src" "${RUNNER_TEMP}/out/${name}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "path=${RUNNER_TEMP}/out/${name}" >> "$GITHUB_OUTPUT"
          # No `size` output any more: its only reader was the __SIZE__ sed of
          # the old website step, and since the 1.36 the page asks the GitHub API
          # for the asset size instead. The log line below keeps the figure
          # where a human looks for it.
          echo "Produced ${name} ($(du -h "$src" | cut -f1)), from $(basename "$src")"

      # `signed=true` only says the SECRET was there. If the keystore path had
      # failed to resolve while Gradle was configuring, `canSign` would be false,
      # the build would produce an UNSIGNED apk without failing, and the publish
      # guard below would wave it through on the strength of that output. An
      # assertion is not a verification: the only thing that settles it is asking
      # the file for its signature.
      - name: Prove the APK is really signed
        if: steps.keystore.outputs.signed == 'true'
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          apksigner="$(find "$sdk/build-tools" -name apksigner -type f | sort | tail -1)"
          if [ -z "$apksigner" ]; then echo "apksigner is not in the SDK" >&2; exit 1; fi
          "$apksigner" verify --print-certs "${{ steps.apk.outputs.path }}"

      # Kept even on a dispatch run, so a build can be inspected without a tag.
      - name: Keep the APK as a run artefact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      # The release asset is the ONLY place the APK lives, and it is also what
      # keeps old versions reachable: the download page points at the asset of
      # the latest release, and the releases page keeps every version for free.
      - name: Attach the APK to a GitHub release
        if: github.ref_type == 'tag' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          SIGNED: ${{ steps.keystore.outputs.signed }}
        run: |
          set -euo pipefail
          # ⚠️ The same guard the old website step had, and it was MISSING here: on a
          # tag pushed while the secrets were absent, an unsigned APK went
          # straight onto a release, where Android refuses to install it. The
          # hole was only reachable by hand before; now that a dispatch can
          # publish, it is one wrong click away.
          if [ "${SIGNED}" != "true" ]; then
            echo "Refusing to release an unsigned APK: Android will not install it." >&2
            exit 1
          fi
          # The release may already exist, for two different reasons: someone cut
          # the tag from GitHub's own "Draft a new release" page, which creates
          # tag and release together, or this same version was published before
          # and is being re-published. Creating it blindly would fail on the path
          # a person is most likely to take.
          if gh release view "${TAG}" > /dev/null 2>&1; then
            gh release upload "${TAG}" "${{ steps.apk.outputs.path }}" --clobber
          else
            # `--target` is what lets the workflow cut its own tag: gh creates
            # the ref at that commit. On a tag push it is the tagged commit
            # anyway, so the same line serves both ways in.
            gh release create "${TAG}" "${{ steps.apk.outputs.path }}" \
              --target "${GITHUB_SHA}" \
              --title "AIV ${{ steps.ver.outputs.version }}" \
              --generate-notes
          fi
