name: Release

# A release starts from a tag and from nothing else. `workflow_dispatch` is here
# so the pipeline can be exercised without cutting one: the first real tag is a
# terrible place to discover that the toolchain step is wrong, and a dispatch
# run without `publish` builds the APK and stops, touching no other repository.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Also copy the APK and its page under roccobot.github.io/AIV/'
        type: boolean
        default: false

# The automatic token is scoped to THIS repository and cannot be widened, which
# is exactly why the website step needs a separate fine-grained PAT. Here the
# token only has to attach the APK to a release of this repo.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the sources
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # compileSdk 37 lives on the SDK PREVIEW channel and its package is called
      # `platforms;android-37.1`: `android-37` does not exist at all, and asking
      # for it fails with a message that reads like a download problem instead of
      # a wrong name. Channel 3 is the preview one. Build tools are left to AGP,
      # which downloads the version it wants once the licences are accepted.
      - name: Install the preview platform
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$sdk" ]; then echo "No Android SDK on this runner" >&2; exit 1; fi
          # `pipefail` is off for this one line on purpose: sdkmanager closes
          # its stdin as soon as the last licence is accepted, `yes` dies of
          # SIGPIPE, and with pipefail on that kills the step even though the
          # licences went through. Without pipefail the pipeline reports
          # sdkmanager's own status, which is the one that matters.
          set +o pipefail
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          set -o pipefail
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --channel=3 "platforms;android-37.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The version is NOT taken from the tag. It lives in app/build.gradle.kts,
      # which stays its single source; the tag is compared against it, so a
      # mismatch stops the release instead of publishing a mislabelled APK.
      - name: Read the version, and check the tag against it
        id: ver
        run: |
          set -euo pipefail
          version="$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' app/build.gradle.kts)"
          if [ -z "$version" ]; then
            echo "versionName not found in app/build.gradle.kts" >&2
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match versionName ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Building version ${version}"

      # An absent keystore is a warning and not a failure: a dispatch run is
      # allowed to prove that the build works before any secret exists. The
      # publish step refuses an unsigned APK on its own, further down.
      - name: Restore the keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.AIV_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No AIV_KEYSTORE_BASE64 secret: the APK will be unsigned."
            exit 0
          fi
          printf '%s' "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/aiv.jks"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build the release APK
        env:
          AIV_KEYSTORE_FILE: ${{ steps.keystore.outputs.signed == 'true' && format('{0}/aiv.jks', runner.temp) || '' }}
          AIV_KEYSTORE_PASSWORD: ${{ secrets.AIV_KEYSTORE_PASSWORD }}
          AIV_KEY_ALIAS: ${{ secrets.AIV_KEY_ALIAS }}
          AIV_KEY_PASSWORD: ${{ secrets.AIV_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Name the artefact
        id: apk
        run: |
          set -euo pipefail
          src="$(find app/build/outputs/apk/release -name '*.apk' -print -quit)"
          if [ -z "$src" ]; then echo "No APK was produced" >&2; exit 1; fi
          name="AIV-${{ steps.ver.outputs.version }}.apk"
          mkdir -p "${RUNNER_TEMP}/out"
          cp "$src" "${RUNNER_TEMP}/out/${name}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "path=${RUNNER_TEMP}/out/${name}" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$src" | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "Produced ${name} ($(du -h "$src" | cut -f1)), from $(basename "$src")"

      # `signed=true` only says the SECRET was there. If the keystore path had
      # failed to resolve while Gradle was configuring, `canSign` would be false,
      # the build would produce an UNSIGNED apk without failing, and the publish
      # guard below would wave it through on the strength of that output. An
      # assertion is not a verification: the only thing that settles it is asking
      # the file for its signature.
      - name: Prove the APK is really signed
        if: steps.keystore.outputs.signed == 'true'
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          apksigner="$(find "$sdk/build-tools" -name apksigner -type f | sort | tail -1)"
          if [ -z "$apksigner" ]; then echo "apksigner is not in the SDK" >&2; exit 1; fi
          "$apksigner" verify --print-certs "${{ steps.apk.outputs.path }}"

      # Kept even on a dispatch run, so a build can be inspected without a tag.
      - name: Keep the APK as a run artefact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      # The release asset is what keeps OLD versions reachable. The website only
      # ever carries the latest APK (see the publish step), so without this every
      # previous build would become unreachable the moment a new tag lands.
      - name: Attach the APK to a GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The release may already exist, because the easiest way to cut a tag
          # without a local clone is GitHub's own "Draft a new release" page,
          # which creates tag and release together. Creating it blindly would
          # fail exactly on the path a person is most likely to take.
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${{ steps.apk.outputs.path }}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${{ steps.apk.outputs.path }}" \
              --title "AIV ${{ steps.ver.outputs.version }}" \
              --generate-notes
          fi

      - name: Copy the APK and its page under roccobot.github.io/AIV/
        if: github.ref_type == 'tag' || inputs.publish
        env:
          SITE_TOKEN: ${{ secrets.SITE_CONTENTS_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          APK_NAME: ${{ steps.apk.outputs.name }}
          APK_PATH: ${{ steps.apk.outputs.path }}
          APK_SIZE: ${{ steps.apk.outputs.size }}
          SIGNED: ${{ steps.keystore.outputs.signed }}
        run: |
          set -euo pipefail
          if [ -z "${SITE_TOKEN}" ]; then
            echo "No SITE_CONTENTS_TOKEN secret: nothing can be written to the website repo." >&2
            exit 1
          fi
          if [ "${SIGNED}" != "true" ]; then
            echo "Refusing to publish an unsigned APK: Android will not install it." >&2
            exit 1
          fi

          git clone --depth 1 \
            "https://x-access-token:${SITE_TOKEN}@github.com/Roccobot/roccobot.github.io.git" site
          mkdir -p site/AIV
          # Only the latest APK stays on the website, and the reason is the PAGE
          # rather than the size: it offers one download, and a folder filling up
          # with old builds would need the page to list and rank them. The
          # archive is the releases page, which keeps every version for free.
          # (Size is no longer the argument it looked like: the minified release
          # apk is 1634026 bytes against the 64 MB of the debug build. Measure
          # the SERVED file and not the run artefact: that one is a zip of the
          # apk and reads about half, because an apk holds uncompressed entries
          # the outer zip squeezes.)
          rm -f site/AIV/*.apk
          cp "${APK_PATH}" "site/AIV/${APK_NAME}"

          sed -e "s|__VERSION__|${VERSION}|g" \
              -e "s|__APK__|${APK_NAME}|g" \
              -e "s|__SIZE__|${APK_SIZE}|g" \
              -e "s|__DATE__|$(date -u '+%Y-%m-%d')|g" \
              -e "s|__YEAR__|$(date -u '+%Y')|g" \
              publish/index.html > site/AIV/index.html

          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AIV
          if git diff --cached --quiet; then
            echo "Nothing changed on the website: no commit."
            exit 0
          fi
          git commit -m "AIV ${VERSION}: APK e pagina di download"
          # The admin editor of 'I Grandi di Arda' commits to master through its
          # Worker, so master can move while this job runs. A rebase and one
          # retry cover that race; a second failure is a real problem worth
          # seeing in the log.
          git push || { git pull --rebase && git push; }
