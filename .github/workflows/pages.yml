name: Pages

# The download page, served at roccobot.github.io/AIV/ by THIS repository since
# 2026-09-27. Until then `release.yml` cloned the website repository at every tag
# and committed the page into its `AIV/` folder, with a fine-grained PAT that
# could write there. A project site needs neither the clone nor the PAT, and the
# address does not change: a project repository called `AIV` takes `/AIV/`
# ahead of a folder with the same name in the website (measured on RatioLab).
#
# ⚠️⚠️ THE APK IS NOT PART OF THE SITE, AND NOTHING IS LOST: the download button
# points at the asset of the latest release (`browser_download_url`, in
# `publish/index.html`), and the page asks the GitHub API for name, size and date
# while it loads. So a release needs no deploy, and the site changes only when
# `publish/` does. The copy of the APK in the website was read by nobody but the
# probe that checked it had arrived.
#
# ⚠️ On `main` and never on a tag: the `github-pages` environment lets only the
# default branch deploy, so a run started by a tag would be refused. Watching
# `publish/` alone is what keeps a code push from redeploying an unchanged page.
on:
  push:
    branches: [main]
    paths: ['publish/**', 'tools/site-check.py', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Two deploys never race: the second one waits, and the site ends up as the
# latest `publish/`. Cancelling would risk stopping a deploy halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out the sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@v6

      # ⚠️⚠️ SINCE 6.29 THE SITE IS A LIST OF FILES TO INCLUDE: the download page, the
      # privacy notice and what they use. `publish/` also holds the feedback document,
      # whose only address is the private Worker (`cloud/feedback/`, since 2026-10-03),
      # and the owner's mockups, left out since 5.70 (his request, 2026-10-11). Until
      # 6.28 the step copied `publish/` and removed a list of names, so 20 files of the
      # feedback document that no page here uses were public, and a new working file in
      # `publish/` went public unless somebody remembered the list. `site-check.py`
      # fails the run if a page names a local file the list forgot.
      - name: Copy the page, the notice and what they use
        run: |
          mkdir -p site/assets
          cp publish/index.html publish/privacy.html publish/anteprima.jpg site/
          cp -r publish/schermate site/
          cp publish/assets/Roboto.ttf publish/assets/Roboto-license.txt site/assets/
          python3 tools/site-check.py site
          find site -type f | sort

      - name: Upload the page
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
