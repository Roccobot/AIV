name: Feedback cloud
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['cloud/feedback/**', 'publish/**', 'tools/feedback-cloud-check.py', '.github/workflows/feedback-cloud.yml']
permissions:
  contents: read
concurrency:
  group: feedback-cloud
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cloud/feedback/package-lock.json
      - name: Prepara gli strumenti bloccati dal lockfile
        run: npm ci --prefix cloud/feedback
      - name: Verifica accesso e archivio privato
        run: node cloud/feedback/worker-test.mjs
      - name: Prepara il browser di prova
        run: |
          python3 -m venv /tmp/aiv-cloud-tests
          /tmp/aiv-cloud-tests/bin/pip install playwright==1.55.0
          /tmp/aiv-cloud-tests/bin/python -m playwright install --with-deps chromium
      - name: Verifica due dispositivi sul Worker locale con R2
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          cloud/feedback/node_modules/.bin/wrangler dev --config cloud/feedback/wrangler.toml --local --port 8787 --persist-to /tmp/aiv-feedback-r2 --var GITHUB_CLIENT_ID:local-test-id --var GITHUB_CLIENT_SECRET:local-test-secret --var SESSION_SECRET:development-test-secret > /tmp/aiv-feedback-local.log 2>&1 &
          feedback_pid=$!
          trap 'kill "$feedback_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/feedback-cloud-config.js > /dev/null; then break; fi
            sleep 1
          done
          /tmp/aiv-cloud-tests/bin/python tools/feedback-cloud-check.py
  deploy:
    needs: check
    if: github.event_name == 'workflow_dispatch' || (vars.CLOUDFLARE_ACCOUNT_ID != '' && vars.FEEDBACK_GITHUB_CLIENT_ID != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cloud/feedback/package-lock.json
      - run: npm ci --prefix cloud/feedback
      - name: Pubblica e verifica il servizio privato
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          FEEDBACK_GITHUB_CLIENT_ID: ${{ vars.FEEDBACK_GITHUB_CLIENT_ID }}
          FEEDBACK_GITHUB_CLIENT_SECRET: ${{ secrets.FEEDBACK_GITHUB_CLIENT_SECRET }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          for field in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID FEEDBACK_GITHUB_CLIENT_ID FEEDBACK_GITHUB_CLIENT_SECRET; do
            if [ -z "${!field}" ]; then echo "Configura il campo riservato o la variabile $field nelle impostazioni del repository."; exit 1; fi
          done
          cloud/feedback/node_modules/.bin/wrangler deploy --config cloud/feedback/wrangler.toml
          cloud/feedback/node_modules/.bin/wrangler secret list --config cloud/feedback/wrangler.toml --format json > /tmp/aiv-feedback-secret-names.json
          node cloud/feedback/deploy-secrets.mjs /tmp/aiv-feedback-secret-names.json | cloud/feedback/node_modules/.bin/wrangler secret bulk --config cloud/feedback/wrangler.toml
          feedback_url=$(node cloud/feedback/deploy-check.mjs)
          echo "Documento cloud pubblicato: $feedback_url" >> "$GITHUB_STEP_SUMMARY"
